<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Comics Bookshelf</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">

    <style>
        @font-face {
            font-family: 'UranusPixel';
            src: url('fonts/Uranus_Pixel_11Px.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            margin: 0;
            padding: 20px;
            background-image: url('background/background6.png');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Pixelify Sans', 'UranusPixel', monospace;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .instruction-box {
            background-color: #e6ccff;
            color: #000000;
            border: 3px ridge #b399ff;
            padding: 10px 20px;
            margin-bottom: 40px;
            margin-top: 20px;
            font-size: 1.2rem;
            text-align: center;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
        }

        .bookshelf {
            width: 80%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            background-color: rgba(140, 100, 200, 0.15);
            border: 5px solid #a888c8;
            padding-top: 20px;
        }

        .shelf {
            height: 250px;
            border-bottom: 15px solid #c8b3e0;
            border-top: 2px solid #8a6aab;
            display: flex;
            align-items: flex-end;
            padding: 0 30px;
            gap: 20px;
            box-shadow: inset 0 -10px 20px rgba(0,0,0,0.4);
            position: relative;
            z-index: 1;
        }

        .book-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 2;
        }

        .book-group:hover {
            z-index: 10;
        }

        .book-link {
            text-decoration: none;
            color: inherit;
            position: relative;
            perspective: 1000px;
            outline: none;
            cursor: pointer;
        }

        .book-container {
            position: relative;
            width: 40px;
            height: 205px;
            transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
            transform-origin: bottom center;
            border: none; 
        }

        .book-container img {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: all 0.5s ease-in-out;
            backface-visibility: hidden;
        }

        .spine-img {
            object-fit: contain;
            transform: rotateY(0deg);
        }

        .cover-img {
            object-fit: contain;
            transform: rotateY(90deg);
            opacity: 0;
        }

        .book-tooltip {
            position: absolute;
            bottom: 110%;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background-color: #e6ccff;
            color: #000000;
            border: 1px solid #000000;
            padding: 5px 8px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            z-index: 20;
            display: flex;
            flex-direction: column;
            text-align: center;
        }

        .book-tooltip .title {
            font-weight: bold;
            font-size: 1.1rem;
        }
        
        .book-link:hover .book-container {
            width: 130px;
            transform: translateY(-20px) scale(1.05);
            box-shadow: 10px 15px 20px rgba(0,0,0,0.6);
        }

        .book-link:hover .spine-img {
            transform: rotateY(-90deg);
            opacity: 0;
        }

        .book-link:hover .cover-img {
            transform: rotateY(0deg);
            opacity: 1;
        }

        .book-link:hover .book-tooltip {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 100;
            justify-content: center;
            align-items: center;
            font-family: 'Pixelify Sans', 'UranusPixel', monospace;
        }

        .modal-window {
            background-color: #f2e6ff;
            border: 4px ridge #b399ff;
            width: 90%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.7);
        }

        .modal-header {
            background-color: #a888c8;
            color: white;
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px ridge #b399ff;
            font-size: 1.2rem;
        }

        .retro-btn {
            background-color: #d1b3ff;
            border: 2px outset #f2e6ff;
            color: black;
            font-family: inherit;
            padding: 5px 12px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.1s;
        }
        .retro-btn:active {
            border: 2px inset #f2e6ff;
            background-color: #b399ff;
        }
        .retro-btn:disabled {
            color: #888;
            border: 2px solid #ccc;
            background-color: #eee;
            cursor: not-allowed;
        }

        #comic-viewer-overlay .modal-window {
            height: 90vh; 
        }

        .viewer-controls {
            background-color: #e6ccff;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #a888c8;
            color: #000;
        }

        #viewer-content {
            flex-grow: 1;
            overflow-y: auto;
            background-color: #222;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .comic-page {
            max-width: 100%;
            height: auto;
            display: none;
        }
        .comic-page.active { display: block; }
        .scroll-mode .comic-page {
            display: block;
            margin-bottom: 15px;
        }

        #click-zone-left, #click-zone-right {
            position: absolute;
            top: 0;
            height: 100%;
            width: 50%;
            cursor: pointer;
            z-index: 10;
        }
        #click-zone-left { left: 0; }
        #click-zone-right { right: 0; }
        .scroll-mode #click-zone-left, .scroll-mode #click-zone-right {
            display: none; 
        }

        /* 留言簿特有样式 */
        #guestbook-overlay .modal-window {
            height: 80vh;
            max-width: 700px;
        }

        #gb-messages-container {
            flex-grow: 1;
            background-color: #fff;
            margin: 10px;
            border: 2px inset #a888c8;
            padding: 15px;
            overflow-y: auto;
        }

    </style>
</head>
<body>

    <div class="instruction-box">
        点选书架上想要看的漫画。
    </div>

    <div class="bookshelf">
        <!-- 第 1 层 -->
        <div class="shelf">
            
            <div class="book-group">
                <a href="#" onclick="openComic('Bad Habits', 'comics/Bad Habits', 34); return false;" class="book-link">
                    <div class="book-tooltip">
                        <span class="title">Bad Habits</span>
                        <span class="author">By Prim</span>
                    </div>
                    <div class="book-container">
                        <img src="comics/spine/badhabits.png" class="spine-img" alt="Bad Habits Spine">
                        <img src="comics/Bad Habits/cover.webp" class="cover-img" alt="Bad Habits Cover">
                    </div>
                </a>
            </div>

        </div>

        <div class="shelf"></div>
        <div class="shelf"></div>
        <div class="shelf"></div>
    </div>

    <!-- 漫画阅读器视窗 -->
    <div id="comic-viewer-overlay" class="modal-overlay">
        <div class="modal-window">
            <div class="modal-header">
                <span id="viewer-title">Reading: Title</span>
                <button class="retro-btn" onclick="closeComic()" style="padding: 2px 8px;">X</button>
            </div>

            <div class="viewer-controls">
                <div>
                    <button class="retro-btn" onclick="prevPage()" id="btn-prev">⬅ Prev</button>
                    <span id="page-counter" style="margin: 0 10px; font-weight: bold;">0 / 34</span>
                    <button class="retro-btn" onclick="nextPage()" id="btn-next">Next ➡</button>
                </div>
                <div>
                    <button class="retro-btn" onclick="openGuestbook()" id="btn-guestbook" style="margin-right: 10px;">Guestbook / 留言簿</button>
                    <button class="retro-btn" onclick="toggleMode()" id="btn-mode">Switch to Scroll ↕ / 切换至滚动</button>
                </div>
            </div>

            <div id="viewer-content">
                <div id="click-zone-left" onclick="prevPage()" title="上一页"></div>
                <div id="click-zone-right" onclick="nextPage()" title="下一页"></div>
                <div id="comic-images-container"></div>
            </div>
        </div>
    </div>

    <!-- 留言簿视窗 (Utterances) -->
    <div id="guestbook-overlay" class="modal-overlay">
        <div class="modal-window">
            <div class="modal-header">
                <span>Guestbook - <span id="gb-title-display">Title</span></span>
                <button class="retro-btn" onclick="closeGuestbook()" style="padding: 2px 8px;">X</button>
            </div>
            
            <div id="gb-messages-container">
                <!-- Utterances 留言板将加载于此 -->
            </div>
        </div>
    </div>

    <script>
        // ----- 漫画阅读器逻辑 -----
        let currentPage = 0;
        let totalPages = 0;
        let isScrollMode = false;
        let currentComicTitle = ""; 

        const comicOverlay = document.getElementById('comic-viewer-overlay');
        const container = document.getElementById('comic-images-container');
        const viewerContent = document.getElementById('viewer-content');
        const pageCounter = document.getElementById('page-counter');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const btnMode = document.getElementById('btn-mode');
        const viewerTitle = document.getElementById('viewer-title');

        function openComic(title, folderPath, lastPageNumber) {
            currentComicTitle = title; 
            viewerTitle.innerText = "Reading: " + title;
            totalPages = lastPageNumber;
            currentPage = 0; 
            isScrollMode = false;
            
            viewerContent.classList.remove('scroll-mode');
            btnMode.innerText = "Switch to Scroll ↕ / 切换至滚动";
            container.innerHTML = ''; 

            for (let i = 0; i <= lastPageNumber; i++) {
                const img = document.createElement('img');
                img.src = `${folderPath}/${i}.webp`; 
                img.className = 'comic-page';
                img.id = `page-${i}`;
                img.loading = "lazy"; 
                container.appendChild(img);
            }

            updateView();
            comicOverlay.style.display = 'flex';
        }

        function closeComic() {
            comicOverlay.style.display = 'none';
            container.innerHTML = ''; 
        }

        function toggleMode() {
            isScrollMode = !isScrollMode;
            if (isScrollMode) {
                viewerContent.classList.add('scroll-mode');
                btnMode.innerText = "Switch to Pages ↔ / 切换至翻页";
                btnPrev.disabled = true;
                btnNext.disabled = true;
                pageCounter.innerText = `All ${totalPages + 1} Pages`;
            } else {
                viewerContent.classList.remove('scroll-mode');
                btnMode.innerText = "Switch to Scroll ↕ / 切换至滚动";
                updateView();
            }
        }

        function nextPage() {
            if (isScrollMode || currentPage >= totalPages) return;
            currentPage++;
            updateView();
        }

        function prevPage() {
            if (isScrollMode || currentPage <= 0) return; 
            currentPage--;
            updateView();
        }

        function updateView() {
            if (isScrollMode) return;
            const allImages = document.querySelectorAll('.comic-page');
            allImages.forEach(img => img.classList.remove('active'));

            const currentImg = document.getElementById(`page-${currentPage}`);
            if (currentImg) {
                currentImg.classList.add('active');
            }

            let displayPageText = (currentPage === 0) ? "Cover" : currentPage;
            pageCounter.innerText = `${displayPageText} / ${totalPages}`;
            
            btnPrev.disabled = (currentPage === 0);
            btnNext.disabled = (currentPage === totalPages);
            viewerContent.scrollTop = 0; 
        }

        // ----- 留言簿逻辑 (改为 Utterances) -----
        const guestbookOverlay = document.getElementById('guestbook-overlay');
        const gbTitleDisplay = document.getElementById('gb-title-display');
        const gbMessagesContainer = document.getElementById('gb-messages-container');

        function openGuestbook() {
            gbTitleDisplay.innerText = currentComicTitle;
            guestbookOverlay.style.display = 'flex';
            gbMessagesContainer.innerHTML = ''; 

            const script = document.createElement('script');
            script.src = "https://utteranc.es/client.js";
            
            // 这里我已经为你填好了你的仓库名！不需要任何复杂的 ID！
            script.setAttribute("repo", "driedpenguin/driedpenguin.github.io"); 
            script.setAttribute("issue-term", currentComicTitle); // 使用漫画名作为 Issue 标题
            script.setAttribute("theme", "github-light");
            script.setAttribute("crossorigin", "anonymous");
            script.async = true;

            gbMessagesContainer.appendChild(script);
        }

        function closeGuestbook() {
            guestbookOverlay.style.display = 'none';
            gbMessagesContainer.innerHTML = ''; // 关闭时清空，避免重复加载
        }
    </script>
</body>
</html>
