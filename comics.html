<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Comics Bookshelf</title>
    
    <!-- 引入英文字体 Pixelify Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">

    <style>
        /* 引入本地的中文字体 */
        @font-face {
            font-family: 'UranusPixel';
            src: url('fonts/Uranus_Pixel_11Px.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        /* 全局样式：设置复古平铺背景和混合字体 */
        body {
            margin: 0;
            padding: 20px;
            /* 背景图铺满全屏设置 */
            background-image: url('background/background6.png');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            /* 优先使用英文像素字体，遇到中文自动回退到本地中文字体 */
            font-family: 'Pixelify Sans', 'UranusPixel', monospace;
            color: #ffffff;
            /* 复古网页喜欢居中排版 */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 顶部提示文字样式 (Web 1.0 风格的文本框) */
        .instruction-box {
            background-color: #e6ccff; /* 淡紫色背景 */
            color: #000000; /* 为了在浅色背景上看清，文字改为黑色 */
            border: 3px ridge #b399ff; /* 淡紫色的凸起边框 */
            padding: 10px 20px;
            margin-bottom: 40px;
            margin-top: 20px;
            font-size: 1.2rem;
            text-align: center;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.5); /* 经典的硬阴影 */
        }

        /* 书架主容器 */
        .bookshelf {
            width: 80%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            background-color: rgba(140, 100, 200, 0.15); /* 给书架背面加一点淡紫色暗底 */
            border: 5px solid #a888c8; /* 淡紫色书架外框 */
            padding-top: 20px;
        }

        /* 每一层书架 */
        .shelf {
            height: 220px; /* 控制层高 */
            border-bottom: 15px solid #c8b3e0; /* 淡紫色木板厚度 */
            border-top: 2px solid #8a6aab; /* 淡紫色木板阴影细节 */
            display: flex;
            align-items: flex-end; /* 让所有的书都坐在架子底部 */
            padding: 0 30px;
            gap: 5px; /* 书与书之间的默认间距 */
            box-shadow: inset 0 -10px 20px rgba(0,0,0,0.4); /* 架子深处的阴影稍微调亮一点 */
            position: relative;
            z-index: 1;
        }

        /* ----- 单本漫画的样式与交互 ----- */

        .book-link {
            text-decoration: none;
            color: inherit;
            position: relative;
            perspective: 1000px; /* 为翻转提供3D透视 */
            outline: none;
            z-index: 2;
        }

        /* 悬停时提升层级，防止被旁边的书挡住 */
        .book-link:hover {
            z-index: 10;
        }

        /* 书本的物理外壳，负责尺寸变化和抽出动画 */
        .book-container {
            position: relative;
            width: 40px; /* 默认：书脊的宽度 */
            height: 205px; /* 书的高度（已加長，讓它更貼近書架頂端） */
            transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
            transform-origin: bottom center;
            /* 已經去除原本的 1px solid black 細線邊框 */
            border: none; 
        }

        /* 统一管理封面和书脊图片 */
        .book-container img {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: all 0.5s ease-in-out;
            backface-visibility: hidden; /* 翻转时隐藏背面 */
        }

        /* 书脊 (默认显示) */
        .spine-img {
            object-fit: contain; /* 改为 contain，保证图片比例不被裁剪且完整显示 */
            transform: rotateY(0deg);
        }

        /* 封面 (默认隐藏，准备翻转) */
        .cover-img {
            object-fit: contain; /* 同样使用 contain 完整显示封面 */
            transform: rotateY(90deg); /* 初始翻转90度隐藏 */
            opacity: 0;
        }

        /* 书名和作者的悬浮提示框 */
        .book-tooltip {
            position: absolute;
            bottom: 110%; /* 出现在书本上方 */
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background-color: #e6ccff; /* 复古淡紫色提示框 */
            color: #000000;
            border: 1px solid #000000;
            padding: 5px 8px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            z-index: 20;
            /* 标题加粗排版 */
            display: flex;
            flex-direction: column;
            text-align: center;
        }

        .book-tooltip .title {
            font-weight: bold;
            font-size: 1.1rem;
        }

        /* --- 核心动画：鼠标悬停触发翻书和抽出效果 --- */
        
        .book-link:hover .book-container {
            width: 130px; /* 容器变宽以容纳封面 */
            transform: translateY(-20px) scale(1.05); /* 向上抽出并稍微放大 */
            box-shadow: 10px 15px 20px rgba(0,0,0,0.6); /* 增加悬空阴影 */
        }

        .book-link:hover .spine-img {
            transform: rotateY(-90deg); /* 书脊向左翻转隐藏 */
            opacity: 0;
        }

        .book-link:hover .cover-img {
            transform: rotateY(0deg); /* 封面翻转至正面 */
            opacity: 1;
        }

        .book-link:hover .book-tooltip {
            opacity: 1;
            transform: translateX(-50%) translateY(0); /* 提示文字浮现 */
        }

        /* ==========================================
           漫画阅读器窗口样式 (新增部分)
           ========================================== */
        #comic-viewer-overlay {
            display: none; /* 默认隐藏 */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85); /* 半透明黑色遮罩 */
            z-index: 100;
            justify-content: center;
            align-items: center;
            font-family: 'Pixelify Sans', 'UranusPixel', monospace;
        }

        .viewer-window {
            background-color: #f2e6ff; /* 极浅紫色背景 */
            border: 4px ridge #b399ff; /* 复古边框 */
            width: 90%;
            max-width: 800px;
            height: 90vh; /* 占据屏幕90%高度 */
            display: flex;
            flex-direction: column;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.7);
        }

        .viewer-header {
            background-color: #a888c8;
            color: white;
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px ridge #b399ff;
            font-size: 1.2rem;
        }

        .viewer-controls {
            background-color: #e6ccff;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #a888c8;
            color: #000;
        }

        /* 复古按钮样式 */
        .retro-btn {
            background-color: #d1b3ff;
            border: 2px outset #f2e6ff;
            color: black;
            font-family: inherit;
            padding: 5px 12px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.1s;
        }

        .retro-btn:active {
            border: 2px inset #f2e6ff;
            background-color: #b399ff;
        }

        .retro-btn:disabled {
            color: #888;
            border: 2px solid #ccc;
            background-color: #eee;
            cursor: not-allowed;
        }

        /* 漫画内容显示区 */
        #viewer-content {
            flex-grow: 1;
            overflow-y: auto; /* 允许上下滚动 */
            background-color: #222; /* 深色背景更适合阅读 */
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 单页模式下的图片样式 */
        .comic-page {
            max-width: 100%;
            height: auto;
            display: none; /* 默认隐藏所有图片 */
        }

        /* 当前激活的图片 */
        .comic-page.active {
            display: block;
        }

        /* 滚动模式下的图片样式 */
        .scroll-mode .comic-page {
            display: block; /* 显示所有图片 */
            margin-bottom: 15px;
        }

        /* 翻页点击热区 (左半边和右半边) */
        #click-zone-left, #click-zone-right {
            position: absolute;
            top: 0;
            height: 100%;
            width: 50%;
            cursor: pointer;
            z-index: 10;
        }
        #click-zone-left { left: 0; }
        #click-zone-right { right: 0; }
        
        /* 滚动模式下隐藏翻页热区 */
        .scroll-mode #click-zone-left, .scroll-mode #click-zone-right {
            display: none; 
        }

    </style>
</head>
<body>

    <!-- 顶部提示文字 -->
    <div class="instruction-box">
        点选书架上想要看的漫画。
    </div>

    <!-- 4层书架结构 -->
    <div class="bookshelf">
        
        <!-- 第 1 层 -->
        <div class="shelf">
            
            <!-- 第一本漫画：Bad Habits -->
            <!-- 【修改点】将 href 改为 javascript 函数触发，并传入书名、路径、总页数 -->
            <a href="#" onclick="openComic('Bad Habits', 'comics/Bad Habits', 34); return false;" class="book-link">
                <div class="book-tooltip">
                    <span class="title">Bad Habits</span>
                    <span class="author">By Prim</span>
                </div>
                <div class="book-container">
                    <img src="comics/spine/badhabits.png" class="spine-img" alt="Bad Habits Spine">
                    <img src="comics/Bad Habits/cover.webp" class="cover-img" alt="Bad Habits Cover">
                </div>
            </a>

        </div>

        <!-- 第 2 层 -->
        <div class="shelf"></div>
        <!-- 第 3 层 -->
        <div class="shelf"></div>
        <!-- 第 4 层 -->
        <div class="shelf"></div>

    </div>

    <!-- ==========================================
         隐藏的漫画阅读器窗口
         ========================================== -->
    <div id="comic-viewer-overlay">
        <div class="viewer-window">
            
            <!-- 顶部标题栏 -->
            <div class="viewer-header">
                <span id="viewer-title">Reading: Title</span>
                <button class="retro-btn" onclick="closeComic()" style="padding: 2px 8px;">X</button>
            </div>

            <!-- 控制栏 -->
            <div class="viewer-controls">
                <div>
                    <button class="retro-btn" onclick="prevPage()" id="btn-prev">⬅ Prev</button>
                    <span id="page-counter" style="margin: 0 10px; font-weight: bold;">1 / 34</span>
                    <button class="retro-btn" onclick="nextPage()" id="btn-next">Next ➡</button>
                </div>
                <div>
                    <button class="retro-btn" onclick="toggleMode()" id="btn-mode">Switch to Scroll ↕</button>
                    <button class="retro-btn" onclick="closeComic()">Back</button>
                </div>
            </div>

            <!-- 漫画显示区域 -->
            <div id="viewer-content">
                <!-- 单页模式的点击热区 -->
                <div id="click-zone-left" onclick="prevPage()" title="上一页"></div>
                <div id="click-zone-right" onclick="nextPage()" title="下一页"></div>
                
                <!-- 图片将由 JavaScript 自动生成在这里 -->
                <div id="comic-images-container"></div>
            </div>

        </div>
    </div>

    <!-- ==========================================
         JavaScript 逻辑控制
         ========================================== -->
    <script>
        let currentPage = 0; // 【修改点】将起始页改为 0
        let totalPages = 0;
        let isScrollMode = false;

        const overlay = document.getElementById('comic-viewer-overlay');
        const container = document.getElementById('comic-images-container');
        const viewerContent = document.getElementById('viewer-content');
        const pageCounter = document.getElementById('page-counter');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const btnMode = document.getElementById('btn-mode');
        const viewerTitle = document.getElementById('viewer-title');

        // 打开漫画阅读器
        function openComic(title, folderPath, lastPageNumber) {
            viewerTitle.innerText = "Reading: " + title;
            totalPages = lastPageNumber; // 最后一页是 34
            currentPage = 0; // 初始化为第 0 页 (封面)
            isScrollMode = false;
            
            // 重置UI状态
            viewerContent.classList.remove('scroll-mode');
            btnMode.innerText = "Switch to Scroll ↕";
            container.innerHTML = ''; // 清空之前的图片

            // 【重点】循环条件从 let i = 0 开始，直到 i <= lastPageNumber
            for (let i = 0; i <= lastPageNumber; i++) {
                const img = document.createElement('img');
                // 自动按顺序生成: 0.webp, 1.webp ... 34.webp
                img.src = `${folderPath}/${i}.webp`; 
                img.className = 'comic-page';
                img.id = `page-${i}`;
                // 原生懒加载
                img.loading = "lazy"; 
                container.appendChild(img);
            }

            updateView();
            overlay.style.display = 'flex'; // 显示窗口
        }

        // 关闭阅读器
        function closeComic() {
            overlay.style.display = 'none';
            container.innerHTML = ''; // 释放内存
        }

        // 切换阅读模式 (单页翻转 <-> 上下滚动)
        function toggleMode() {
            isScrollMode = !isScrollMode;
            if (isScrollMode) {
                viewerContent.classList.add('scroll-mode');
                btnMode.innerText = "Switch to Pages ↔";
                // 滚动模式下禁用翻页按钮
                btnPrev.disabled = true;
                btnNext.disabled = true;
                // 显示包含封面在内的总页数 (+1)
                pageCounter.innerText = `All ${totalPages + 1} Pages`;
            } else {
                viewerContent.classList.remove('scroll-mode');
                btnMode.innerText = "Switch to Scroll ↕";
                // 恢复到当前页
                updateView();
            }
        }

        // 下一页
        function nextPage() {
            if (isScrollMode || currentPage >= totalPages) return;
            currentPage++;
            updateView();
        }

        // 上一页
        function prevPage() {
            if (isScrollMode || currentPage <= 0) return; // 【修改点】上一页的极限变为 0
            currentPage--;
            updateView();
        }

        // 更新视图（单页模式下只显示当前页，更新页码）
        function updateView() {
            if (isScrollMode) return;

            // 隐藏所有图片
            const allImages = document.querySelectorAll('.comic-page');
            allImages.forEach(img => img.classList.remove('active'));

            // 只显示当前页
            const currentImg = document.getElementById(`page-${currentPage}`);
            if (currentImg) {
                currentImg.classList.add('active');
            }

            // 【修改点】如果是第 0 页，文字显示为 "Cover"，否则正常显示页码
            let displayPageText = (currentPage === 0) ? "Cover" : currentPage;
            pageCounter.innerText = `${displayPageText} / ${totalPages}`;
            
            // 按钮禁用判断
            btnPrev.disabled = (currentPage === 0);
            btnNext.disabled = (currentPage === totalPages);
            
            // 每次翻页自动回到窗口顶部
            viewerContent.scrollTop = 0; 
        }
    </script>
</body>
</html>
