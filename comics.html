
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Comics Bookshelf</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        @font-face {
            font-family: 'UranusPixel';
            src: url('fonts/Uranus_Pixel_11Px.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            margin: 0;
            padding: 20px;
            background-image: url('background/background6.png');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Pixelify Sans', 'UranusPixel', monospace;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .instruction-box {
            background-color: #e6ccff;
            color: #000000;
            border: 3px ridge #b399ff;
            padding: 10px 20px;
            margin-bottom: 40px;
            margin-top: 20px;
            font-size: 1.2rem;
            text-align: center;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
        }

        .bookshelf {
            width: 80%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            background-color: rgba(140, 100, 200, 0.15);
            border: 5px solid #a888c8;
            padding-top: 20px;
        }

        .shelf {
            height: 250px;
            border-bottom: 15px solid #c8b3e0;
            border-top: 2px solid #8a6aab;
            display: flex;
            align-items: flex-end;
            padding: 0 30px;
            gap: 20px;
            box-shadow: inset 0 -10px 20px rgba(0,0,0,0.4);
            position: relative;
            z-index: 1;
        }

        .book-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 2;
        }

        .book-group:hover { z-index: 10; }

        .book-link {
            text-decoration: none;
            color: inherit;
            position: relative;
            perspective: 1000px;
            outline: none;
            cursor: pointer;
        }

        .book-container {
            position: relative;
            width: 40px;
            height: 205px;
            transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
            transform-origin: bottom center;
        }

        .book-container img {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: all 0.5s ease-in-out;
            backface-visibility: hidden;
            object-fit: contain;
        }

        .spine-img { transform: rotateY(0deg); }
        .cover-img { transform: rotateY(90deg); opacity: 0; }

        .book-tooltip {
            position: absolute;
            bottom: 110%;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background-color: #e6ccff;
            color: #000000;
            border: 1px solid #000000;
            padding: 5px 8px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            z-index: 20;
            display: flex;
            flex-direction: column;
            text-align: center;
        }

        .book-link:hover .book-container {
            width: 130px;
            transform: translateY(-20px) scale(1.05);
            box-shadow: 10px 15px 20px rgba(0,0,0,0.6);
        }

        .book-link:hover .spine-img { transform: rotateY(-90deg); opacity: 0; }
        .book-link:hover .cover-img { transform: rotateY(0deg); opacity: 1; }
        .book-link:hover .book-tooltip { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* 弹窗通用样式 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 100;
            justify-content: center;
            align-items: center;
            font-family: 'Pixelify Sans', 'UranusPixel', monospace;
        }

        .modal-window {
            background-color: #f2e6ff;
            border: 4px ridge #b399ff;
            width: 90%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.7);
        }

        .modal-header {
            background-color: #a888c8;
            color: white;
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px ridge #b399ff;
            font-size: 1.2rem;
        }

        .retro-btn {
            background-color: #d1b3ff;
            border: 2px outset #f2e6ff;
            color: black;
            font-family: inherit;
            padding: 5px 12px;
            cursor: pointer;
            font-size: 1rem;
            margin: 2px;
        }

        .retro-btn:active { border: 2px inset #f2e6ff; background-color: #b399ff; }

        /* 漫画查看器样式 */
        #comic-viewer-overlay .modal-window { height: 90vh; }
        .viewer-controls {
            background-color: #e6ccff;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #a888c8;
            color: #000;
        }

        #viewer-content {
            flex-grow: 1;
            overflow-y: auto;
            background-color: #222;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .comic-page { max-width: 100%; height: auto; display: none; }
        .comic-page.active { display: block; }
        .scroll-mode .comic-page { display: block; margin-bottom: 15px; }

        #click-zone-left, #click-zone-right {
            position: absolute; top: 0; height: 100%; width: 50%;
            cursor: pointer; z-index: 10;
        }
        #click-zone-left { left: 0; } #click-zone-right { right: 0; }
        .scroll-mode #click-zone-left, .scroll-mode #click-zone-right { display: none; }

        /* 留言簿特有样式 */
        #guestbook-overlay .modal-window { height: 75vh; max-width: 600px; }
        #gb-messages-container {
            flex-grow: 1;
            background-color: #fff;
            margin: 10px;
            border: 2px inset #a888c8;
            padding: 10px;
            overflow-y: auto;
            color: #333;
        }
        .gb-message-item { border-bottom: 1px dashed #ccc; padding: 10px 0; }
        .gb-message-item .meta { font-size: 0.8rem; color: #666; margin-bottom: 4px; }
        .gb-message-item .meta strong { color: #a888c8; font-size: 1rem; }
        .gb-input-area {
            background-color: #e6ccff;
            padding: 10px;
            border-top: 2px solid #a888c8;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .gb-input-area input, .gb-input-area textarea {
            font-family: inherit; border: 2px inset #c8b3e0;
            padding: 5px; background-color: #fff;
        }
    </style>
</head>
<body>

    <div class="instruction-box">点选书架上想要看的漫画。</div>
    <img src="https://cdn.jsdelivr.net/gh/driedpenguin/image/poweredbygallith.gif" alt="poweredbygallith">
    <div class="bookshelf">
        <div class="shelf">
            <div class="book-group">
                <a href="#" onclick="openComic('Bad Habits', 'comics/Bad Habits', 34); return false;" class="book-link">
                    <div class="book-tooltip">
                        <span style="font-weight:bold; font-size:1.1rem;">Bad Habits</span>
                        <span>By Prim</span>
                    </div>
                    <div class="book-container">
                        <img src="comics/spine/badhabits.png" class="spine-img" alt="Spine">
                        <img src="comics/Bad Habits/cover.webp" class="cover-img" alt="Cover">
                    </div>
                </a>
            </div>
        </div>
        <div class="shelf"></div><div class="shelf"></div><div class="shelf"></div>
    </div>

    <div id="comic-viewer-overlay" class="modal-overlay">
        <div class="modal-window">
            <div class="modal-header">
                <span id="viewer-title">Reading</span>
                <button class="retro-btn" onclick="closeComic()" style="padding: 2px 8px;">X</button>
            </div>
            <div class="viewer-controls">
                <div>
                    <button class="retro-btn" onclick="prevPage()" id="btn-prev">⬅ Prev</button>
                    <span id="page-counter" style="margin: 0 10px; font-weight: bold;">0 / 34</span>
                    <button class="retro-btn" onclick="nextPage()" id="btn-next">Next ➡</button>
                </div>
                <div>
                    <button class="retro-btn" onclick="openGuestbook()">Guestbook / 留言簿</button>
                    <button class="retro-btn" onclick="toggleMode()" id="btn-mode">Switch to Scroll ↕ / 切换至滚动</button>
                </div>
            </div>
            <div id="viewer-content">
                <div id="click-zone-left" onclick="prevPage()"></div>
                <div id="click-zone-right" onclick="nextPage()"></div>
                <div id="comic-images-container"></div>
            </div>
        </div>
    </div>
    <!-- 纯正 Web 1.0 风格的留言板窗口 -->
    <div id="guestbook-overlay" class="modal-overlay">
        <div class="modal-window">
            <div class="modal-header">
                <span>Guestbook - <span id="gb-title-display"></span></span>
                <button class="retro-btn" onclick="closeGuestbook()" style="padding: 2px 8px;">X</button>
            </div>
            <div id="gb-messages-container">读取中...</div>
            <div class="gb-input-area">
                <input type="text" id="gb-name" placeholder="Your Name / 你的昵称 (匿名可不填)" maxlength="20">
                <textarea id="gb-text" placeholder="Leave a message... / 留下你的足迹..." maxlength="200"></textarea>
                <button class="retro-btn" id="btn-submit-gb" onclick="submitMessage()">Sign Guestbook / 签下大名</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. 初始化 Supabase 数据库 (务必填写你的数据！)
        // ==========================================
        const SUPABASE_URL = 'https://teayijsnomfmnjwudqqt.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRlYXlpanNub21mbW5qd3VkcXF0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1MDAzMzEsImV4cCI6MjA5NjA3NjMzMX0._TuhehCV1GsmroA8mGnm9O5bq_5ghUC_zq6Hp2Cklog';
        
        // 【修正1】將變數名稱改為 _supabase，與下方的調用保持一致
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // （阅读器逻辑保持不变）
        let currentPage = 0;
        let totalPages = 0;
        let isScrollMode = false;
        let currentComicTitle = "";

        function openComic(title, folderPath, lastPage) {
            currentComicTitle = title;
            totalPages = lastPage;
            currentPage = 0;
            isScrollMode = false;
            document.getElementById('viewer-title').innerText = "Reading: " + title;
            
            const container = document.getElementById('comic-images-container');
            container.innerHTML = '';
            for (let i = 0; i <= lastPage; i++) {
                const img = document.createElement('img');
                img.src = `${folderPath}/${i}.webp`;
                img.className = 'comic-page';
                img.id = `page-${i}`;
                img.loading = "lazy";
                container.appendChild(img);
            }
            updateView();
            document.getElementById('comic-viewer-overlay').style.display = 'flex';
        }

        function updateView() {
            if (isScrollMode) return;
            document.querySelectorAll('.comic-page').forEach(img => img.classList.remove('active'));
            document.getElementById(`page-${currentPage}`).classList.add('active');
            document.getElementById('page-counter').innerText = (currentPage === 0 ? "Cover" : currentPage) + " / " + totalPages;
            document.getElementById('btn-prev').disabled = (currentPage === 0);
            document.getElementById('btn-next').disabled = (currentPage === totalPages);
            document.getElementById('viewer-content').scrollTop = 0;
        }

        function nextPage() { if (currentPage < totalPages) { currentPage++; updateView(); } }
        function prevPage() { if (currentPage > 0) { currentPage--; updateView(); } }
        function closeComic() { document.getElementById('comic-viewer-overlay').style.display = 'none'; }
        function toggleMode() {
            isScrollMode = !isScrollMode;
            const content = document.getElementById('viewer-content');
            const btn = document.getElementById('btn-mode');
            if (isScrollMode) {
                content.classList.add('scroll-mode');
                btn.innerText = "Switch to Pages ↔ / 切换至翻页";
            } else {
                content.classList.remove('scroll-mode');
                btn.innerText = "Switch to Scroll ↕ / 切换至滚动";
                updateView();
            }
        }

        // --- 留言簿数据库逻辑 ---
        async function openGuestbook() {
            document.getElementById('gb-title-display').innerText = currentComicTitle;
            document.getElementById('guestbook-overlay').style.display = 'flex';
            fetchMessages();
        }

        async function fetchMessages() {
            const container = document.getElementById('gb-messages-container');
            container.innerHTML = '读取中...';
            
            const { data, error } = await _supabase
                .from('Guestbook')
                .select('*')
                .eq('comicTitle', currentComicTitle)
                .order('created_at', { ascending: false });

            if (error) { container.innerHTML = '读取失败: ' + error.message; return; }
            if (data.length === 0) { container.innerHTML = '还没有人留言哦，快来占个沙发吧！'; return; }

            container.innerHTML = '';
            data.forEach(msg => {
                const div = document.createElement('div');
                div.className = 'gb-message-item';
                const date = new Date(msg.created_at).toLocaleString();
                div.innerHTML = `<div class="meta"><strong>${msg.nickname}</strong> - ${date}</div><div>${msg.content}</div>`;
                container.appendChild(div);
            });
        }

        async function submitMessage() {
            const name = document.getElementById('gb-name').value.trim() || "匿名";
            const content = document.getElementById('gb-text').value.trim();
            if (!content) return alert("内容不能为空！");

            // 【修正2】按鈕 ID 修正為 btn-submit-gb
            const btn = document.getElementById('btn-submit-gb');
            btn.disabled = true; btn.innerText = "发送中...";

            const { error } = await _supabase
                .from('Guestbook')
                .insert([{ comicTitle: currentComicTitle, nickname: name, content: content }]);

            btn.disabled = false; btn.innerText = "Sign Guestbook / 签下大名";
            if (error) alert("发送失败: " + error.message);
            else {
                document.getElementById('gb-text').value = '';
                fetchMessages();
            }
        }

        function closeGuestbook() { document.getElementById('guestbook-overlay').style.display = 'none'; }
    </script>
</body>
</html>
